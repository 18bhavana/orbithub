<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ORBITHUB.IN — A Space for Ideas</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    color: white;
    background: #04010c;
}

/* =========================================
   UNIVERSE
========================================= */

.universe {
    position: relative;

    width: 100%;
    height: 100vh;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(100, 0, 255, .11),
            transparent 30%
        ),
        radial-gradient(
            circle at 20% 20%,
            rgba(40, 0, 130, .12),
            transparent 30%
        ),
        radial-gradient(
            circle at 80% 80%,
            rgba(100, 0, 180, .08),
            transparent 30%
        ),
        #04010c;
}

/* =========================================
   STARS
========================================= */

.stars {
    position: absolute;
    inset: 0;

    background-image:
        radial-gradient(
            circle,
            rgba(255,255,255,.85) 1px,
            transparent 1.5px
        ),
        radial-gradient(
            circle,
            rgba(150,130,255,.6) 1px,
            transparent 1.5px
        ),
        radial-gradient(
            circle,
            rgba(255,255,255,.4) 1px,
            transparent 1.5px
        );

    background-size:
        180px 180px,
        290px 290px,
        420px 420px;

    background-position:
        20px 30px,
        80px 110px,
        150px 60px;

    opacity: .55;
}

/* =========================================
   AMBIENT GLOW
========================================= */

.ambient {
    position: absolute;

    width: 700px;
    height: 700px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(130,30,255,.14),
            rgba(80,0,180,.05) 45%,
            transparent 70%
        );

    filter: blur(30px);

    animation:
        ambientPulse 6s ease-in-out infinite;
}

@keyframes ambientPulse {

    0%,
    100% {
        transform:
            translate(-50%, -50%)
            scale(1);
    }

    50% {
        transform:
            translate(-50%, -50%)
            scale(1.12);
    }
}

/* =========================================
   BRAND
========================================= */

.brand {
    position: absolute;

    top: 38px;
    left: 50%;

    transform:
        translateX(-50%);

    z-index: 20;

    font-size: 19px;

    font-weight: 600;

    letter-spacing: 8px;

    white-space: nowrap;

    color: #fff;
}

.brand span {
    color: #a84cff;
}

.brand-line {
    position: absolute;

    top: 72px;
    left: 50%;

    transform:
        translateX(-50%);

    width: 45px;
    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #a64dff,
            transparent
        );
}

/* =========================================
   ORBITAL SYSTEM
========================================= */

.orbit-system {
    position: absolute;

    width: 500px;
    height: 500px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    z-index: 5;
}

/* =========================================
   CORE
========================================= */

.core {
    position: absolute;

    width: 125px;
    height: 125px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 32% 25%,
            #fff 0%,
            #e5c8ff 10%,
            #bd55ff 28%,
            #8900ff 50%,
            #43008a 72%,
            #17002f 100%
        );

    box-shadow:
        0 0 25px rgba(170,70,255,.9),
        0 0 65px rgba(130,30,255,.55),
        0 0 130px rgba(100,0,255,.25),

        inset -18px -20px 35px
        rgba(0,0,0,.5);

    animation:
        coreFloat 5s ease-in-out infinite;
}

@keyframes coreFloat {

    0%,
    100% {
        transform:
            translate(-50%, -50%)
            scale(1);
    }

    50% {
        transform:
            translate(-50%, -50%)
            scale(1.04);
    }
}

.core::before {
    content: "";

    position: absolute;

    width: 42px;
    height: 42px;

    left: 25px;
    top: 19px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.95),
            rgba(255,255,255,.2),
            transparent
        );

    filter: blur(4px);
}

/* =========================================
   PULSE
========================================= */

.pulse {
    position: absolute;

    width: 170px;
    height: 170px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    border:
        1px solid
        rgba(170,90,255,.22);

    border-radius: 50%;

    animation:
        pulse 4s ease-out infinite;
}

.pulse.two {
    animation-delay: 1.3s;
}

.pulse.three {
    animation-delay: 2.6s;
}

@keyframes pulse {

    0% {
        width: 140px;
        height: 140px;
        opacity: .6;
    }

    100% {
        width: 330px;
        height: 330px;
        opacity: 0;
    }
}

/* =========================================
   ORBIT RINGS
========================================= */

.ring {
    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    border:
        1px solid
        rgba(145,90,255,.22);

    pointer-events: none;
}

.ring.one {
    width: 270px;
    height: 105px;

    transform:
        translate(-50%, -50%)
        rotate(20deg);

    animation:
        ringOne 14s linear infinite;
}

.ring.two {
    width: 340px;
    height: 130px;

    transform:
        translate(-50%, -50%)
        rotate(-32deg);

    border-color:
        rgba(60,190,255,.18);

    animation:
        ringTwo 18s linear infinite;
}

.ring.three {
    width: 430px;
    height: 165px;

    transform:
        translate(-50%, -50%)
        rotate(65deg);

    border-color:
        rgba(180,70,255,.14);

    animation:
        ringThree 23s linear infinite;
}

.ring.four {
    width: 490px;
    height: 195px;

    transform:
        translate(-50%, -50%)
        rotate(-12deg);

    border-color:
        rgba(90,110,255,.08);

    animation:
        ringFour 28s linear infinite;
}

@keyframes ringOne {
    to {
        transform:
            translate(-50%, -50%)
            rotate(380deg);
    }
}

@keyframes ringTwo {
    to {
        transform:
            translate(-50%, -50%)
            rotate(328deg);
    }
}

@keyframes ringThree {
    to {
        transform:
            translate(-50%, -50%)
            rotate(425deg);
    }
}

@keyframes ringFour {
    to {
        transform:
            translate(-50%, -50%)
            rotate(348deg);
    }
}

/* =========================================
   PARTICLES
========================================= */

.particle {
    position: absolute;

    border-radius: 50%;

    z-index: 10;
}

.cyan {
    width: 9px;
    height: 9px;

    background: #65eaff;

    box-shadow:
        0 0 12px #65eaff,
        0 0 25px rgba(65,220,255,.6);
}

.purple {
    width: 9px;
    height: 9px;

    background: #c15cff;

    box-shadow:
        0 0 12px #c15cff,
        0 0 25px rgba(180,70,255,.6);
}

.white {
    width: 6px;
    height: 6px;

    background: #fff;

    box-shadow:
        0 0 12px #fff;
}

.p1 {
    left: 47px;
    top: 190px;

    animation:
        floatOne 7s ease-in-out infinite;
}

.p2 {
    right: 35px;
    top: 225px;

    animation:
        floatTwo 9s ease-in-out infinite;
}

.p3 {
    left: 120px;
    bottom: 50px;

    animation:
        floatThree 8s ease-in-out infinite;
}

.p4 {
    right: 115px;
    top: 80px;

    animation:
        floatFour 11s ease-in-out infinite;
}

@keyframes floatOne {
    50% {
        transform:
            translate(35px, -25px);
    }
}

@keyframes floatTwo {
    50% {
        transform:
            translate(-30px, 35px);
    }
}

@keyframes floatThree {
    50% {
        transform:
            translate(20px, -30px);
    }
}

@keyframes floatFour {
    50% {
        transform:
            translate(-25px, 30px);
    }
}

/* =========================================
   LEFT MESSAGE
========================================= */

.message {
    position: absolute;

    left: 55px;
    top: 50%;

    transform:
        translateY(-50%);

    width: 230px;

    z-index: 20;
}

.message-label {
    color: #995cff;

    font-size: 9px;

    letter-spacing: 4px;

    text-transform: uppercase;

    margin-bottom: 17px;
}

.message h2 {
    color: #e9e3f7;

    font-size: 25px;

    line-height: 1.25;

    font-weight: 400;

    margin-bottom: 14px;
}

.message p {
    color: #646177;

    font-size: 11px;

    line-height: 1.8;
}

/* =========================================
   RIGHT CTA
========================================= */

.cta-area {
    position: absolute;

    right: 55px;
    top: 50%;

    transform:
        translateY(-50%);

    width: 220px;

    z-index: 20;

    text-align: right;
}

.cta-label {
    color: #747087;

    font-size: 10px;

    line-height: 1.8;

    margin-bottom: 16px;
}

.cta-label strong {
    display: block;

    color: #d7d0e7;

    font-size: 13px;

    font-weight: 400;

    margin-bottom: 4px;
}

.contact {
    display: inline-flex;

    align-items: center;

    gap: 9px;

    padding:
        11px
        18px;

    border:
        1px solid
        rgba(160,100,255,.35);

    border-radius: 30px;

    color: #ded4ff;

    text-decoration: none;

    font-size: 10px;

    letter-spacing: 2px;

    text-transform: uppercase;

    background:
        rgba(90,30,160,.08);

    transition: .3s ease;
}

.contact:hover {
    border-color:
        rgba(190,140,255,.8);

    background:
        rgba(100,40,180,.15);

    box-shadow:
        0 0 25px
        rgba(150,70,255,.2);

    transform:
        translateY(-2px);
}

.contact span {
    color: #b65cff;

    font-size: 14px;
}

/* =========================================
   BOTTOM
========================================= */

.bottom {
    position: absolute;

    bottom: 25px;

    left: 55px;
    right: 55px;

    display: flex;

    justify-content: space-between;

    color: #3e3a4c;

    font-size: 8px;

    letter-spacing: 3px;

    text-transform: uppercase;

    z-index: 20;
}

/* =========================================
   MOBILE
========================================= */

@media (max-width: 800px) {

    .brand {
        top: 25px;

        font-size: 16px;

        letter-spacing: 6px;
    }

    .brand-line {
        top: 52px;
    }

    .message {
        left: 20px;
        top: 18%;

        transform: none;

        width: 155px;
    }

    .message-label {
        font-size: 7px;

        letter-spacing: 3px;
    }

    .message h2 {
        font-size: 17px;
    }

    .message p {
        display: none;
    }

    .cta-area {
        right: 20px;
        top: 18%;

        transform: none;

        width: 160px;
    }

    .cta-label {
        font-size: 9px;
    }

    .cta-label strong {
        font-size: 11px;
    }

    .orbit-system {
        transform:
            translate(-50%, -50%)
            scale(.68);
    }

    .bottom {
        left: 20px;
        right: 20px;
    }

    .bottom span:first-child {
        display: none;
    }
}

@media (max-width: 500px) {

    .message {
        top: 16%;
    }

    .cta-area {
        top: 16%;
    }

    .orbit-system {
        top: 54%;

        transform:
            translate(-50%, -50%)
            scale(.56);
    }

    .bottom {
        bottom: 15px;
    }
}
</style>
</head>

<body>

<div class="universe">

    <!-- Stars -->
    <div class="stars"></div>

    <!-- Ambient glow -->
    <div class="ambient"></div>

    <!-- Brand -->
    <div class="brand">
        ORBIT<span>HUB</span>
    </div>

    <div class="brand-line"></div>

    <!-- Left message -->
    <section class="message">

        <div class="message-label">
            A Space Awaits
        </div>

        <h2>
            A space is waiting
            for the right idea.
        </h2>

        <p>
            Every great destination
            starts with a vision.
            Perhaps this one is yours.
        </p>

    </section>

    <!-- Right CTA -->
    <section class="cta-area">

        <div class="cta-label">

            <strong>
                Could this be your next destination?
            </strong>

            If something here sparks
            an idea, let's talk.

        </div>

        <a
            class="contact"
            href="mailto:traju.r99@gmail.com?subject=Exploring%20Orbit%20Hub"
        >
            <span>✦</span>
            Start a Conversation
        </a>

    </section>

    <!-- Orbital system -->
    <div class="orbit-system">

        <!-- Orbit rings -->
        <div class="ring one"></div>
        <div class="ring two"></div>
        <div class="ring three"></div>
        <div class="ring four"></div>

        <!-- Pulse -->
        <div class="pulse"></div>
        <div class="pulse two"></div>
        <div class="pulse three"></div>

        <!-- Particles -->
        <div class="particle cyan p1"></div>
        <div class="particle purple p2"></div>
        <div class="particle white p3"></div>
        <div class="particle cyan p4"></div>

        <!-- Central energy -->
        <div class="core"></div>

    </div>

    <!-- Bottom -->
    <div class="bottom">

        <span>
            ORBITAL SYSTEM // 001
        </span>

        <span>
            FIND YOUR ORBIT
        </span>

    </div>

</div>

</body>
</html>
